<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>مدرستي — منصة الدراسة</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--panel2:#192840;--line:#2a3b54;--text:#eef4ff;--muted:#9aacc5;--accent:#79b8ff;--accent2:#9b8cff;--ok:#72d6ad;--danger:#ff8e9c;--shadow:0 16px 45px #0002}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--panel2:#edf2fa;--line:#d8e0ed;--text:#17253b;--muted:#66758d;--accent:#246cce;--accent2:#6756c8;--ok:#16845e;--danger:#c83e55;--shadow:0 12px 35px #25365312}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent);text-decoration:none}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{border-left:1px solid var(--line);padding:24px 16px;background:var(--panel);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#6cb7ff,#8272e8);color:#091426;font-weight:900;font-size:20px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}.nav{display:grid;gap:7px}.nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:11px 13px;text-align:right;border-radius:12px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}.main{min-width:0;padding:28px clamp(16px,3vw,42px) 70px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.4px}.top h1{font-size:clamp(25px,3vw,34px);margin:3px 0;font-weight:800;letter-spacing:-.5px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:11px;transition:transform .16s,border-color .16s}.btn:hover{transform:translateY(-1px);border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#071323;font-weight:800}.btn.danger{color:var(--danger)}.btn.small{padding:5px 9px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}.panel,.stat,.item{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .label{color:var(--muted);font-size:13px}.stat strong{font-size:29px;display:block;margin:4px 0}.stat .sub{font-size:12px;color:var(--muted)}.section{margin-top:28px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.sectionhead h2{font-size:19px;margin:0}.panel{padding:20px}.hero{border-radius:22px;padding:24px;background:linear-gradient(115deg,var(--panel),var(--panel2));border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.hero h2{margin:5px 0;font-size:clamp(22px,3vw,31px)}.hero p{margin:0;color:var(--muted)}.heroMark{font-size:45px;opacity:.9}.item{padding:17px;min-width:0;transition:transform .16s,border-color .16s}.item:hover{transform:translateY(-2px);border-color:#6689bb}.itemtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.item h3{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}.item p{margin:4px 0;color:var(--muted);font-size:13px}.itemicon{width:40px;height:40px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;font-size:20px;flex-shrink:0}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:12px 0}.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:10px 0}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s}.itemfoot{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:18px}.crumbs button{border:0;background:none;color:var(--accent);padding:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text)}textarea{min-height:82px;resize:vertical}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{padding:35px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.searchrow input{flex:1;min-width:170px}.list{display:grid;gap:9px}.lecture{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.check{width:22px;height:22px;accent-color:var(--ok)}.lecturetitle{font-weight:700;overflow-wrap:anywhere}.lecture.done .lecturetitle{text-decoration:line-through;color:var(--muted)}.lecture small{display:block;color:var(--muted);font-size:12px}.lectureBtns{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.pill{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted)}.chat{display:grid;gap:12px;max-width:850px}.messages{display:grid;gap:10px;max-height:480px;overflow:auto;padding:3px}.bubble{padding:12px 15px;border-radius:15px;max-width:90%;white-space:pre-wrap}.bubble.user{background:var(--accent);color:#071323;margin-right:auto}.bubble.bot{background:var(--panel2);border:1px solid var(--line);margin-left:auto}.chatform{display:flex;gap:8px}.chatform input{flex:1}.notice{padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 17px;border-radius:12px;z-index:10;max-width:min(420px,90vw)}.hidden{display:none!important}.weekdays{display:flex;gap:8px;flex-wrap:wrap}.day{display:flex;gap:6px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px}.footnote{font-size:12px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:20px 0}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block}.side{height:auto;position:static;padding:12px;border-left:0;border-bottom:1px solid var(--line);gap:10px}.brand{padding:3px 6px}.nav{display:flex;overflow-x:auto;gap:5px;padding-bottom:3px}.nav button{white-space:nowrap;padding:9px 11px;font-size:13px}.sidefoot{display:none}.main{padding:18px 13px 45px}.top{align-items:flex-start}.top .actions .btn{padding:7px 9px}.hero{padding:18px}.heroMark{display:none}.grid,.grid.subjects{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.item{padding:13px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.lecture{grid-template-columns:auto minmax(0,1fr);gap:9px}.lectureBtns{grid-column:2}.bubble{max-width:96%}}
@media(max-width:420px){.grid,.grid.subjects{grid-template-columns:1fr}.top{display:block}.top .actions{margin-top:10px}.hero h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><div class="logo">م</div><div><b>مدرستي</b><small>مساحتك الدراسية</small></div></div>
<nav class="nav" id="nav">
<button data-page="home" class="active">⌂　الرئيسية</button><button data-page="subjects">▦　موادي</button><button data-page="plan">◷　خطة الدراسة</button><button data-page="assistant">✳　المساعد</button><button data-page="stats">▥　الإحصائيات</button><button data-page="settings">⚙　الإعدادات</button>
</nav><div class="sidefoot">البيانات محفوظة محليًا في هذا المتصفح فقط.<br>لا يوجد حساب أو تسجيل دخول.</div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">منصة السادس الإعدادي العراقي</div><h1 id="pageTitle">الرئيسية</h1><div class="muted" id="pageSub">رتّب دراستك وتابع تقدّمك خطوة بخطوة.</div></div><div class="actions"><button class="btn" id="quickAdd">＋ إضافة</button><button class="btn" id="themeBtn" title="تغيير المظهر">☼ المظهر</button></div></header><div id="view"></div></main>
</div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(function(){
const KEY='madrasti-local-v3';
const defaultSubjects=[['الرياضيات','∑'],['الفيزياء','⚛'],['الكيمياء','⚗'],['الأحياء','❀'],['اللغة العربية','ع'],['اللغة الإنجليزية','A'],['التربية الإسلامية','☾']];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const blank=()=>({subjects:defaultSubjects.map(([name,icon],i)=>({id:uid(),name,icon,description:'',order:i,teachers:[]})),plans:[],activity:[],theme:'dark',accent:'blue',prefs:{hours:4,days:[0,1,2,3,4,6]},chat:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state){try{const old=JSON.parse(localStorage.getItem('madrasti-local-v2')||localStorage.getItem('madrasti-state')||'null');if(old&&Array.isArray(old.subjects)){state=blank();state.subjects=old.subjects.map((s,i)=>({id:s.id||uid(),name:s.name||'مادة',icon:s.icon||'▦',description:s.description||'',order:i,teachers:s.teachers||[]}));}}catch(e){}}
state=state||blank();state.subjects=Array.isArray(state.subjects)?state.subjects:[];state.plans=state.plans||[];state.activity=state.activity||[];state.prefs=state.prefs||{hours:4,days:[0,1,2,3,4,6]};state.chat=state.chat||[];
let page='home',subjectId=null,teacherId=null,chapterId=null,query='',filter='all',viewMode='list';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function log(type,label){state.activity.unshift({id:uid(),type,label,at:new Date().toISOString()});state.activity=state.activity.slice(0,250);save()}
function allTeachers(){return state.subjects.flatMap(s=>s.teachers.map(t=>({...t,subject:s})))}
function findSubject(id){return state.subjects.find(s=>s.id===id)}
function findTeacher(sid,tid){return findSubject(sid)?.teachers.find(t=>t.id===tid)}
function findChapter(sid,tid,cid){return findTeacher(sid,tid)?.chapters?.find(c=>c.id===cid)}
function lecturesOf(c){return c?.lectures||[]}
function allLectures(){return state.subjects.flatMap(s=>s.teachers.flatMap(t=>(t.chapters||[]).flatMap(c=>(c.lectures||[]).map(l=>({...l,subject:s,teacher:t,chapter:c})))));}
function progress(items){return items.length?Math.round(items.filter(l=>l.completed).length/items.length*100):0}
function fmt(sec){if(!sec)return '—';return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function duration(items){return items.reduce((n,l)=>n+(Number(l.duration)||0),0)}
function durationLabel(n){if(!n)return '—';const h=Math.floor(n/3600),m=Math.floor(n%3600/60);return h?h+' س '+m+' د':m+' دقيقة'}
function statCard(label,value,sub){return '<div class="stat"><div class="label">'+label+'</div><strong>'+value+'</strong><div class="sub">'+sub+'</div></div>'}
function bar(p){return '<div class="bar" aria-label="التقدم '+p+'%"><span style="width:'+p+'%"></span></div>'}
function empty(title,desc,btn,act){return '<div class="empty"><strong>'+title+'</strong>'+desc+(btn?'<div style="margin-top:14px"><button class="btn primary" data-act="'+act+'">'+btn+'</button></div>':'')+'</div>'}
function heading(title,desc,btn,act){return '<div class="sectionhead"><div><h2>'+title+'</h2>'+(desc?'<div class="muted" style="font-size:13px">'+desc+'</div>':'')+'</div>'+(btn?'<button class="btn primary" data-act="'+act+'">'+btn+'</button>':'')+'</div>'}
function subjectCard(s){let ts=s.teachers||[], chapters=ts.flatMap(t=>t.chapters||[]), ls=chapters.flatMap(c=>c.lectures||[]),p=progress(ls);return '<article class="item"><div class="itemtop"><div><h3>'+esc(s.name)+'</h3><p>'+esc(s.description||'مادة دراسية')+'</p></div><div class="itemicon">'+esc(s.icon||'▦')+'</div></div><div class="meta"><span>'+ts.length+' مدرس</span><span>'+chapters.length+' فصل</span><span>'+ls.length+' محاضرة</span></div>'+bar(p)+'<div class="meta"><span>'+p+'% مكتمل</span><span>'+ls.filter(l=>l.completed).length+' من '+ls.length+'</span></div><div class="itemfoot"><button class="btn primary small" data-act="open-subject" data-id="'+s.id+'">فتح المادة</button><button class="btn small" data-act="edit-subject" data-id="'+s.id+'">تعديل</button></div></article>'}
function render(){document.documentElement.dataset.theme=state.theme==='light'?'light':'dark';const titles={home:['الرئيسية','رتّب دراستك وتابع تقدّمك خطوة بخطوة.'],subjects:['موادي','المواد والمدرسون والفصول والمحاضرات في مكان واحد.'],plan:['خطة الدراسة','خطط واقعية محفوظة على جهازك.'],assistant:['المساعد الدراسي','نفّذ أوامر تنظيم بسيطة بالعربية داخل بياناتك المحلية.'],stats:['الإحصائيات','أرقام محسوبة من بياناتك الفعلية.'],settings:['الإعدادات','تحكم بالمظهر والنسخ الاحتياطي والبيانات.'],add:['إضافة محتوى','أضف مادة أو مدرسًا أو فصلًا أو محاضرة.'],chapter:['المحاضرات','قائمة محاضرات الفصل المحدد.'],favorites:['المفضلة','المحاضرات التي وضعتها في المفضلة.']};$('pageTitle').textContent=(titles[page]||titles.home)[0];$('pageSub').textContent=(titles[page]||titles.home)[1];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let v=$('view');if(page==='home')v.innerHTML=home();else if(page==='subjects')v.innerHTML=subjectsPage();else if(page==='plan')v.innerHTML=planPage();else if(page==='assistant')v.innerHTML=assistantPage();else if(page==='stats')v.innerHTML=statsPage();else if(page==='settings')v.innerHTML=settingsPage();else if(page==='add')v.innerHTML=addPage();else if(page==='chapter')v.innerHTML=chapterPage();else if(page==='favorites')v.innerHTML=favoritesPage();else v.innerHTML=home();}
function home(){const ls=allLectures(),done=ls.filter(l=>l.completed),subjects=state.subjects,active=allTeachers().filter(t=>(t.chapters||[]).some(c=>(c.lectures||[]).length)).length;const next=ls.find(l=>!l.completed);let recent=state.activity.slice(0,4);return '<div class="hero"><div><div class="eyebrow">مسارك الدراسي يبدأ هنا</div><h2>أهلاً بك، جاهز تكمل دراستك؟</h2><p>كل محاضرة تنجزها تقرّبك من هدفك. تقدّمك يُحسب تلقائيًا من قائمتك.</p><div class="actions" style="margin-top:17px"><button class="btn primary" data-act="go-subjects">استعرض موادي</button>'+(next?'<button class="btn" data-act="open-next" data-id="'+next.id+'">▶ متابعة الدراسة</button>':'')+'</div></div><div class="heroMark">✦</div></div><div class="grid">'+statCard('المواد',subjects.length,'المواد المسجلة')+statCard('المحاضرات',ls.length,'ضمن جميع المدرسين')+statCard('المكتملة',done.length,'محاضرة أُنجزت')+statCard('التقدم الكلي',progress(ls)+'%','من المحاضرات المسجلة')+'</div><section class="section">'+heading('موادي','ملخص سريع للتقدم','＋ إضافة مادة','add-subject')+'<div class="grid subjects">'+(subjects.length?subjects.slice().sort((a,b)=>(a.order||0)-(b.order||0)).slice(0,6).map(subjectCard).join(''):empty('ما عندك مواد بعد','ابدأ بإضافة أول مادة.','إضافة مادة','add-subject'))+'</div></section><section class="section">'+heading('آخر نشاط','الأحداث المسجلة في هذا المتصفح')+(recent.length?'<div class="list">'+recent.map(a=>'<div class="panel"><b>'+esc(a.label)+'</b><div class="footnote">'+new Date(a.at).toLocaleString('ar-IQ')+'</div></div>').join('')+'</div>':empty('لا يوجد نشاط بعد','عند إكمال محاضرة أو تعديل خطتك سيظهر النشاط هنا.'))+'</section><div class="notice" style="margin-top:22px">خصوصية البيانات: معلوماتك تُحفظ في تخزين المتصفح على هذا الجهاز. امسح بيانات المتصفح أو استخدم متصفحًا آخر وقد تفقدها؛ صدّر نسخة احتياطية من الإعدادات بانتظام.</div>'}
function subjectsPage(){return heading('جميع المواد','افتح المادة لإدارة المدرسين والفصول','＋ إضافة مادة','add-subject')+'<div class="grid subjects">'+(state.subjects.length?state.subjects.slice().sort((a,b)=>(a.order||0)-(b.order||0)).map(subjectCard).join(''):empty('لا توجد مواد','أضف مادة لتبدأ.','إضافة مادة','add-subject'))+'</div>'}
function subjectDetail(s){let ts=s.teachers||[];return '<div class="crumbs"><button data-act="go-subjects">موادي</button> ‹ <span>'+esc(s.name)+'</span></div>'+heading(s.name,esc(s.description||'اختر مدرسًا لعرض فصوله'),'＋ إضافة مدرس','add-teacher')+'<div class="grid subjects">'+(ts.length?ts.map(t=>teacherCard(s,t)).join(''):empty('لا يوجد مدرسون لهذه المادة','يمكنك إضافة أكثر من مدرس، ولكل واحد فصول ومحاضرات مستقلة.','إضافة مدرس','add-teacher'))+'</div><div class="formactions"><button class="btn" data-act="edit-subject" data-id="'+s.id+'">تعديل المادة</button><button class="btn danger" data-act="delete-subject" data-id="'+s.id+'">حذف المادة</button></div>'}
function teacherCard(s,t){let cs=t.chapters||[],ls=cs.flatMap(c=>c.lectures||[]),p=progress(ls);return '<article class="item"><div class="itemtop"><div><h3>'+esc(t.name)+'</h3><p>'+esc(t.description||'مدرس '+s.name)+'</p></div><div class="itemicon">♙</div></div><div class="meta"><span>'+cs.length+' فصل</span><span>'+ls.length+' محاضرة</span><span>'+p+'% مكتمل</span></div>'+bar(p)+'<div class="itemfoot"><button class="btn primary small" data-act="open-teacher" data-sid="'+s.id+'" data-id="'+t.id+'">فتح الدورة</button><button class="btn small" data-act="edit-teacher" data-sid="'+s.id+'" data-id="'+t.id+'">تعديل</button><button class="btn small danger" data-act="delete-teacher" data-sid="'+s.id+'" data-id="'+t.id+'">حذف</button></div></article>'}
function teacherDetail(s,t){let cs=t.chapters||[];return '<div class="crumbs"><button data-act="go-subjects">موادي</button> ‹ <button data-act="open-subject" data-id="'+s.id+'">'+esc(s.name)+'</button> ‹ <span>'+esc(t.name)+'</span></div>'+heading('فصول '+esc(t.name),'الفصول والمحاضرات خاصة بهذا المدرس','＋ إضافة فصل','add-chapter')+'<div class="grid subjects">'+(cs.length?cs.map(c=>chapterCard(s,t,c)).join(''):empty('لا توجد فصول بعد','أضف فصلًا، ثم أضف المحاضرات أو احفظ رابط قائمة التشغيل.','إضافة فصل','add-chapter'))+'</div><div class="formactions"><button class="btn" data-act="edit-teacher" data-sid="'+s.id+'" data-id="'+t.id+'">تعديل المدرس</button></div>'}

function chapterPage(){let s=findSubject(subjectId),t=findTeacher(subjectId,teacherId),c=findChapter(subjectId,teacherId,chapterId);if(!s||!t||!c)return empty('لم يتم العثور على الفصل','قد يكون قد حُذف.','العودة للمواد','go-subjects');let ls=c.lectures||[];const visible=ls.filter(l=>(!query||((l.title+' '+(l.url||'')).toLowerCase().includes(query.toLowerCase())))&&(filter==='all'||(filter==='done'&&l.completed)||(filter==='todo'&&!l.completed)||(filter==='fav'&&l.favorite)));return '<div class="crumbs"><button data-act="go-subjects">موادي</button> ‹ <button data-act="open-subject" data-id="'+s.id+'">'+esc(s.name)+'</button> ‹ <button data-act="open-teacher" data-sid="'+s.id+'" data-id="'+t.id+'">'+esc(t.name)+'</button> ‹ <span>'+esc(c.name)+'</span></div><div class="hero"><div><div class="eyebrow">'+esc(s.name)+' / '+esc(t.name)+'</div><h2>'+esc(c.name)+'</h2><p>'+ls.filter(l=>l.completed).length+' من '+ls.length+' محاضرة مكتملة · '+durationLabel(duration(ls))+'</p>'+bar(progress(ls))+'</div><div class="actions"><button class="btn primary" data-act="add-lecture">＋ محاضرة</button><button class="btn" data-act="edit-chapter" data-sid="'+s.id+'" data-tid="'+t.id+'" data-id="'+c.id+'">تعديل الفصل</button></div></div><div class="notice">قائمة تشغيل YouTube: '+(c.playlistUrl?'<button class="btn small" data-act="play-playlist" data-url="'+esc(c.playlistUrl)+'" data-title="'+esc(c.name)+'">▶ مشاهدة القائمة بالترتيب</button> <a href="'+esc(c.playlistUrl)+'" target="_blank" rel="noopener noreferrer">فتح على YouTube</a>':'أضف رابط القائمة من تعديل الفصل')+'. يمكنك أيضًا لصق روابط المحاضرات دفعة واحدة وسيحفظها التطبيق بالترتيب الذي تضعه.</div><div class="actions" style="margin:12px 0"><button class="btn" data-act="bulk-lectures">＋ إضافة قائمة روابط دفعة واحدة</button></div><div class="section"><div class="searchrow"><input id="lectureSearch" placeholder="ابحث باسم المحاضرة..." value="'+esc(query)+'"><select id="lectureFilter"><option value="all" '+(filter==='all'?'selected':'')+'>كل المحاضرات</option><option value="todo" '+(filter==='todo'?'selected':'')+'>غير مكتملة</option><option value="done" '+(filter==='done'?'selected':'')+'>مكتملة</option><option value="fav" '+(filter==='fav'?'selected':'')+'>المفضلة</option></select><button class="btn" data-act="add-lecture">＋ إضافة</button></div><div class="list">'+(visible.length?visible.map(l=>lectureRow(l,s,t,c)).join(''):empty('لا توجد محاضرات مطابقة','أضف محاضرة يدويًا أو غيّر البحث والتصفية.','إضافة محاضرة','add-lecture'))+'</div></div>'}
function lectureRow(l,s,t,c){return '<div class="lecture '+(l.completed?'done':'')+'"><input class="check" type="checkbox" aria-label="تحديد '+esc(l.title)+' كمكتملة" data-act="toggle-lecture" data-sid="'+s.id+'" data-tid="'+t.id+'" data-cid="'+c.id+'" data-id="'+l.id+'" '+(l.completed?'checked':'')+'><div><div class="lecturetitle">'+esc(l.title)+'</div><small>'+(l.duration?fmt(l.duration)+' · ':'')+(l.completed?'مكتملة':'غير مكتملة')+(l.favorite?' · ★ مفضلة':'')+'</small></div><div class="lectureBtns">'+(l.url?'<button class="btn small" data-act="play-lecture" data-url="'+esc(l.url)+'" data-title="'+esc(l.title)+'">▶ مشاهدة</button>':'')+'<button class="btn small" data-act="favorite" data-sid="'+s.id+'" data-tid="'+t.id+'" data-cid="'+c.id+'" data-id="'+l.id+'">'+(l.favorite?'★':'☆')+'</button><button class="btn small" data-act="edit-lecture" data-sid="'+s.id+'" data-tid="'+t.id+'" data-cid="'+c.id+'" data-id="'+l.id+'">تعديل</button><button class="btn small danger" data-act="delete-lecture" data-sid="'+s.id+'" data-tid="'+t.id+'" data-cid="'+c.id+'" data-id="'+l.id+'">حذف</button></div></div>'}
function addPage(){return '<div class="panel"><div class="sectionhead"><h2>إضافة محتوى</h2></div><div class="grid subjects"><button class="item" data-act="add-subject"><h3>＋ مادة جديدة</h3><p>أنشئ مادة دراسية.</p></button><button class="item" data-act="add-teacher"><h3>♙ مدرس</h3><p>أضف مدرسًا للمادة المفتوحة.</p></button><button class="item" data-act="add-chapter"><h3>▤ فصل</h3><p>أنشئ فصلًا للمدرس المحدد.</p></button><button class="item" data-act="add-lecture"><h3>▶ محاضرة</h3><p>أضف عنوانًا ورابط فيديو.</p></button></div><div class="notice" style="margin-top:15px">يمكنك إدارة كل القوائم يدويًا. استيراد بيانات YouTube الحقيقية من قوائم التشغيل غير متاح دون إضافة backend ومفتاح API آمن.</div></div>'}
function planPage(){let days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];return '<div class="panel"><h2 style="margin-top:0">إنشاء خطة أسبوعية</h2><p class="muted">تقدير من المحاضرات المتبقية، وليس وعدًا بوقت إنجاز دقيق. يمكنك تعديلها وحفظها محليًا.</p><form id="planForm"><div class="formgrid"><div class="field"><label for="planTitle">اسم الخطة</label><input id="planTitle" value="خطتي الدراسية الأسبوعية" required></div><div class="field"><label for="hours">ساعات الدراسة يوميًا</label><input id="hours" type="number" min="1" max="16" value="'+esc(state.prefs.hours||4)+'" required></div><div class="field full"><label>أيام الدراسة</label><div class="weekdays">'+days.map((d,i)=>'<label class="day"><input type="checkbox" name="day" value="'+i+'" '+((state.prefs.days||[]).includes(i)?'checked':'')+'> '+d+'</label>').join('')+'</div></div><div class="field full"><label>المواد (اترك الكل محددًا لدراسة جميع المواد)</label><div class="weekdays">'+state.subjects.map(s=>'<label class="day"><input type="checkbox" name="planSubject" value="'+s.id+'" checked> '+esc(s.name)+'</label>').join('')+'</div></div></div><div class="formactions"><button class="btn primary" type="submit">إنشاء وحفظ الخطة</button></div></form></div><section class="section">'+heading('خططي المحفوظة','لا تؤثر الخطة على حالة إكمال المحاضرات')+(state.plans.length?'<div class="list">'+state.plans.map(p=>'<div class="panel"><div class="itemtop"><div><h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+'</p></div><span class="pill">'+esc(p.daysCount)+' أيام/أسبوع</span></div><div class="meta"><span>'+p.perDay+' محاضرة/يوم تقريبًا</span><span>'+p.hours+' ساعات/يوم</span><span>'+p.remaining+' متبقية وقت الإنشاء</span></div><button class="btn small danger" data-act="delete-plan" data-id="'+p.id+'">حذف الخطة</button></div>').join('')+'</div>':empty('لا توجد خطط محفوظة','حدد ساعاتك وأيامك ثم أنشئ خطة.'))+'</section>'}
function statsPage(){const ls=allLectures(),done=ls.filter(l=>l.completed),teachers=allTeachers();return '<div class="grid">'+statCard('إجمالي المواد',state.subjects.length,'مواد')+statCard('المدرسون',teachers.length,'دورات مستقلة')+statCard('الفصول',teachers.reduce((n,t)=>n+(t.chapters||[]).length,0),'فصل')+statCard('المحاضرات المتبقية',ls.length-done.length,'غير مكتملة')+'</div><section class="section">'+heading('التقدم حسب المادة','يُحسب من المحاضرات التي أضفتها لكل مدرس')+'<div class="list">'+state.subjects.map(s=>{let ls=(s.teachers||[]).flatMap(t=>(t.chapters||[]).flatMap(c=>c.lectures||[]));return '<div class="panel"><div class="itemtop"><b>'+esc(s.name)+'</b><span>'+progress(ls)+'%</span></div>'+bar(progress(ls))+'<div class="meta"><span>'+ls.filter(l=>l.completed).length+' مكتملة</span><span>'+ls.length+' إجمالي</span><span>'+durationLabel(duration(ls.filter(l=>!l.completed)))+' متبقي من المدة المعروفة</span></div></div>'}).join('')+'</div></section><section class="section">'+heading('التقدم حسب المدرس','كل مدرس له سجل مستقل')+'<div class="list">'+(teachers.length?teachers.map(t=>{let ls=(t.chapters||[]).flatMap(c=>c.lectures||[]);return '<div class="panel"><div class="itemtop"><b>'+esc(t.subject.name)+' — '+esc(t.name)+'</b><span>'+progress(ls)+'%</span></div>'+bar(progress(ls))+'<div class="meta"><span>'+ls.filter(l=>l.completed).length+'/'+ls.length+' مكتملة</span></div></div>'}).join(''):empty('لا يوجد مدرسون','أضف مدرسًا من داخل مادة.'))+'</div></section>'}
function favoritesPage(){const ls=allLectures().filter(l=>l.favorite);return heading('المفضلة','محاضراتك المحفوظة')+'<div class="list">'+(ls.length?ls.map(l=>lectureRow(l,l.subject,l.teacher,l.chapter)).join(''):empty('ما عندك مفضلة','اضغط ☆ بجانب أي محاضرة لإضافتها.'))+'</div>'}
function assistantPage(){return '<div class="notice" style="margin-bottom:14px">هذا مساعد محلي بسيط ينفّذ أوامر محددة على بيانات المتصفح. ليس نموذج ذكاء اصطناعي متصلًا، ولا يستطيع استيراد قوائم YouTube تلقائيًا. يمكنك إدارة كل شيء يدويًا من الأقسام الأخرى.</div><div class="panel chat"><div class="messages" id="messages">'+(state.chat.length?state.chat.map(m=>'<div class="bubble '+(m.role==='user'?'user':'bot')+'">'+esc(m.text)+'</div>').join(''): '<div class="bubble bot">هلا بيك! أگدر أساعدك بأوامر مثل: «كم محاضرة متبقية؟»، «اعرض موادي»، أو «أكمل المحاضرة الأولى في [اسم الفصل]» إذا كان اسم الفصل واضحًا. للحذف استخدم واجهة القوائم حتى تتأكد من الهدف.</div>')+'</div><form class="chatform" id="chatForm"><input id="chatInput" placeholder="اكتب أمرًا بالعربية..." autocomplete="off" required><button class="btn primary">إرسال</button></form><div class="footnote">الأوامر المدعومة حاليًا محدودة عمدًا؛ لن أدّعي تنفيذ أمر غير مدعوم.</div></div>'}
function settingsPage(){return '<div class="panel"><h2 style="margin-top:0">المظهر</h2><p class="muted">اختر المظهر الذي يناسبك. الاختيار يُحفظ على هذا الجهاز.</p><div class="actions"><button class="btn" data-act="theme-dark">☾ داكن</button><button class="btn" data-act="theme-light">☼ فاتح</button></div><hr><h2>النسخ الاحتياطي</h2><p class="muted">صدّر المواد والمدرسين والفصول والمحاضرات والتقدم والخطط وسجل النشاط إلى ملف JSON. احتفظ به خارج المتصفح.</p><div class="actions"><button class="btn primary" data-act="export">↓ تصدير نسخة احتياطية</button><label class="btn">↑ استيراد نسخة احتياطية<input type="file" id="importFile" accept="application/json,.json" hidden></label></div><hr><h2>حالة الخدمات</h2><div class="notice">التخزين: محلي داخل المتصفح ✓<br>تسجيل الدخول/الحسابات: غير مستخدمة حسب طلبك ✓<br>YouTube API: غير مربوط — استيراد بيانات القائمة تلقائيًا يتطلب خادمًا ومفتاحًا لا يمكن وضعه بأمان داخل صفحة عامة.<br>مساعد AI خارجي: غير مربوط — المساعد الحالي يدعم أوامر محلية محدودة فقط.</div><hr><h2>إدارة البيانات</h2><p class="muted">إعادة الضبط تحذف البيانات المحلية نهائيًا من هذا المتصفح. صدّر نسخة أولًا إذا احتجت إليها.</p><button class="btn danger" data-act="reset">إعادة ضبط البيانات</button></div>'}
function formModal(title,fields,submitLabel,callback){let old=document.getElementById('modalWrap');if(old)old.remove();let html='<div id="modalWrap" style="position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:16px"><section class="panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle" style="width:min(600px,100%);max-height:90vh;overflow:auto"><h2 id="modalTitle" style="margin-top:0">'+title+'</h2><form id="dynamicForm"><div class="formgrid">'+fields.map(f=>'<div class="field '+(f.full?'full':'')+'"><label for="f_'+f.name+'">'+f.label+'</label>'+(f.type==='textarea'?'<textarea id="f_'+f.name+'" name="'+f.name+'" '+(f.required?'required':'')+'>'+esc(f.value||'')+'</textarea>':f.type==='select'?'<select id="f_'+f.name+'" name="'+f.name+'" '+(f.required?'required':'')+'>'+f.options.map(o=>'<option value="'+esc(o.value)+'" '+(o.value===f.value?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select>':'<input id="f_'+f.name+'" name="'+f.name+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" '+(f.required?'required':'')+' '+(f.placeholder?'placeholder="'+esc(f.placeholder)+'"':'')+' '+(f.min!==undefined?'min="'+f.min+'"':'')+'>')+'</div>').join('')+'</div><div class="formactions"><button class="btn primary" type="submit">'+submitLabel+'</button><button class="btn" type="button" id="cancelModal">إلغاء</button></div></form></section></div>';$('view').insertAdjacentHTML('beforeend',html);$('cancelModal').onclick=()=>document.getElementById('modalWrap').remove();$('dynamicForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());callback(data);document.getElementById('modalWrap')?.remove();};setTimeout(()=>$('dynamicForm').querySelector('input,textarea,select')?.focus(),30)}
function addSubject(existing){formModal(existing?'تعديل المادة':'إضافة مادة',[{name:'name',label:'اسم المادة',value:existing?.name,required:true},{name:'icon',label:'رمز بسيط (اختياري)',value:existing?.icon||'▦'},{name:'description',label:'وصف (اختياري)',type:'textarea',full:true,value:existing?.description}],existing?'حفظ التعديلات':'إضافة المادة',d=>{if(existing){Object.assign(existing,d)}else state.subjects.push({id:uid(),...d,order:state.subjects.length,teachers:[]});save();toast(existing?'تم تعديل المادة':'تمت إضافة المادة');render()})}
function addTeacher(existing){let s=findSubject(subjectId);if(!s){toast('افتح المادة أولًا حتى تحدد المدرس');return}formModal(existing?'تعديل المدرس':'إضافة مدرس إلى '+s.name,[{name:'name',label:'اسم المدرس',value:existing?.name,required:true},{name:'description',label:'ملاحظات/وصف',type:'textarea',full:true,value:existing?.description}],existing?'حفظ التعديلات':'إضافة المدرس',d=>{if(existing)Object.assign(existing,d);else s.teachers.push({id:uid(),...d,chapters:[]});save();toast('تم حفظ المدرس');render()})}
function addChapter(existing){let t=findTeacher(subjectId,teacherId);if(!t){toast('افتح دورة المدرس أولًا');return}formModal(existing?'تعديل الفصل':'إضافة فصل',[{name:'name',label:'اسم الفصل',value:existing?.name,required:true},{name:'description',label:'وصف الفصل',type:'textarea',full:true,value:existing?.description},{name:'playlistUrl',label:'رابط قائمة تشغيل YouTube (اختياري)',type:'url',full:true,value:existing?.playlistUrl,placeholder:'https://www.youtube.com/playlist?list=...'}],existing?'حفظ التعديلات':'إضافة الفصل',d=>{if(existing)Object.assign(existing,d);else t.chapters.push({id:uid(),...d,lectures:[]});save();toast('تم حفظ الفصل');render()})}
function addLecture(existing){let c=findChapter(subjectId,teacherId,chapterId);if(!c){toast('افتح الفصل أولًا');return}formModal(existing?'تعديل المحاضرة':'إضافة محاضرة',[{name:'title',label:'عنوان المحاضرة',value:existing?.title,required:true},{name:'url',label:'رابط الفيديو (اختياري)',type:'url',full:true,value:existing?.url,placeholder:'https://www.youtube.com/watch?v=...'},{name:'duration',label:'المدة بالثواني (اختياري)',type:'number',min:0,value:existing?.duration||''}],existing?'حفظ التعديلات':'إضافة المحاضرة',d=>{if(existing)Object.assign(existing,{title:d.title,url:d.url,duration:Number(d.duration)||0});else c.lectures.push({id:uid(),title:d.title,url:d.url,duration:Number(d.duration)||0,completed:false,favorite:false,createdAt:new Date().toISOString()});save();log('lecture',existing?'تعديل محاضرة: '+d.title:'إضافة محاضرة: '+d.title);toast('تم حفظ المحاضرة');render()})}
function youtubeId(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2];if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]}catch(e){}return null}
function playYoutube(url,title,playlist=false){if(!url){toast('الرابط غير موجود');return}let src='';try{const u=new URL(url);const list=u.searchParams.get('list');const id=youtubeId(url);if(playlist||list){if(!list&&!u.pathname.includes('/playlist')){toast('رابط قائمة التشغيل غير صحيح');return}src='https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list||'')}else{if(!id){toast('رابط YouTube غير واضح');return}src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)} }catch(e){toast('الرابط غير صحيح');return}let old=document.getElementById('ytModal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend','<div id="ytModal" style="position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:14px"><section class="panel" style="width:min(900px,100%);max-height:95vh;overflow:auto"><div class="itemtop"><h2 style="margin:0">'+esc(title||'محاضرة YouTube')+'</h2><button class="btn" id="closeYt">✕ إغلاق</button></div><div style="position:relative;padding-top:56.25%;margin-top:12px"><iframe src="'+src+'" title="'+esc(title||'مشغل YouTube')+'" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><p class="muted">المشاهدة تتم عبر مشغّل YouTube الرسمي داخل التطبيق.</p></section></div>');document.getElementById('closeYt').onclick=()=>document.getElementById('ytModal')?.remove()}
function bulkLectures(){const c=findChapter(subjectId,teacherId,chapterId);if(!c){toast('افتح الفصل أولًا');return}formModal('إضافة محاضرات متعددة',[{name:'links',label:'الصق روابط YouTube — رابط بكل سطر وبالترتيب المطلوب',type:'textarea',full:true,required:true,value:'',placeholder:'https://www.youtube.com/watch?v=...\nhttps://youtu.be/...'}],'استيراد وترتيب المحاضرات',d=>{const urls=d.links.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);const valid=urls.filter(x=>youtubeId(x));if(!valid.length){toast('لم أجد روابط فيديو YouTube صحيحة');return}const start=c.lectures.length;valid.forEach((url,i)=>c.lectures.push({id:uid(),title:'محاضرة '+(start+i+1),url,duration:0,completed:false,favorite:false,createdAt:new Date().toISOString()}));save();log('lecture','استيراد '+valid.length+' روابط محاضرات');toast('تمت إضافة '+valid.length+' محاضرة حسب ترتيب الروابط');render()})}

function context(d){return {s:findSubject(d.s||d.sid||subjectId),t:findTeacher(d.s||d.sid||subjectId,d.t||d.tid||teacherId),c:findChapter(d.s||d.sid||subjectId,d.t||d.tid||teacherId,d.c||d.cid||chapterId)}}
function act(a,d={}){const {s,t,c}=context(d);switch(a){
case'go-subjects':page='subjects';subjectId=teacherId=chapterId=null;query='';render();break;
case'add-subject':addSubject();break;
case'add-teacher':addTeacher();break;case'add-chapter':addChapter();break;case'add-lecture':addLecture();break;case'play-lecture':playYoutube(d.url,d.title);break;case'play-playlist':playYoutube(d.url,d.title,true);break;case'bulk-lectures':bulkLectures();break;
case'open-subject':subjectId=d.id;teacherId=chapterId=null;page='subjects';render();$('view').innerHTML=subjectDetail(findSubject(subjectId)||{});break;
case'open-teacher':subjectId=d.sid||subjectId;teacherId=d.id;chapterId=null;page='subjects';render();$('view').innerHTML=teacherDetail(findSubject(subjectId),findTeacher(subjectId,teacherId));break;
case'open-chapter':subjectId=d.sid;teacherId=d.tid;chapterId=d.id;query='';filter='all';page='chapter';render();break;
case'edit-subject':addSubject(findSubject(d.id));break;
case'edit-teacher':subjectId=d.sid||subjectId;addTeacher(findTeacher(subjectId,d.id));break;
case'edit-chapter':subjectId=d.sid||subjectId;teacherId=d.tid||teacherId;addChapter(findChapter(subjectId,teacherId,d.id));break;
case'edit-lecture':subjectId=d.sid||subjectId;teacherId=d.tid||teacherId;chapterId=d.cid||chapterId;addLecture(findChapter(subjectId,teacherId,chapterId)?.lectures.find(l=>l.id===d.id));break;
case'delete-subject':if(s&&confirm('حذف مادة «'+s.name+'» مع جميع المدرسين والفصول والمحاضرات التابعة لها؟ لا يمكن التراجع.')){state.subjects=state.subjects.filter(x=>x.id!==s.id);subjectId=null;save();log('delete','حذف مادة: '+s.name);render()}break;
case'delete-teacher':if(t&&confirm('حذف المدرس «'+t.name+'» مع فصوله ومحاضراته وتقدمه؟')){s.teachers=s.teachers.filter(x=>x.id!==t.id);save();log('delete','حذف مدرس: '+t.name);render()}break;
case'delete-chapter':if(c&&confirm('حذف الفصل «'+c.name+'» وكل محاضراته؟')){t.chapters=t.chapters.filter(x=>x.id!==c.id);save();log('delete','حذف فصل: '+c.name);render()}break;
case'delete-lecture':if(c){let l=c.lectures.find(x=>x.id===d.id);if(l&&confirm('حذف المحاضرة «'+l.title+'»؟')){c.lectures=c.lectures.filter(x=>x.id!==l.id);save();log('delete','حذف محاضرة: '+l.title);render()}}break;
case'toggle-lecture':if(c){let l=c.lectures.find(x=>x.id===d.id);if(l){l.completed=!!d.checked;l.completedAt=l.completed?new Date().toISOString():null;save();log('progress',(l.completed?'إكمال':'إلغاء إكمال')+' المحاضرة: '+l.title);render()}}break;
case'favorite':if(c){let l=c.lectures.find(x=>x.id===d.id);if(l){l.favorite=!l.favorite;save();toast(l.favorite?'أضيفت للمفضلة':'أزيلت من المفضلة');render()}}break;
case'open-next':{let l=allLectures().find(x=>x.id===d.id);if(l){subjectId=l.subject.id;teacherId=l.teacher.id;chapterId=l.chapter.id;page='chapter';render();if(l.url)window.open(l.url,'_blank','noopener,noreferrer')}break}
case'go-plan':page='plan';render();break;
case'theme-dark':state.theme='dark';save();render();break;case'theme-light':state.theme='light';save();render();break;
case'export':exportData();break;case'reset':if(confirm('متأكد؟ سيُحذف كل ما حفظته محليًا من هذا المتصفح.')){localStorage.removeItem(KEY);state=blank();save();subjectId=teacherId=chapterId=null;page='home';render();toast('تمت إعادة الضبط')}break;
case'delete-plan':if(confirm('حذف هذه الخطة؟')){state.plans=state.plans.filter(p=>p.id!==d.id);save();render()}break;
default:break}}
function exportData(){const blob=new Blob([JSON.stringify({app:'مدرستي',version:3,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='madrasti-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('تم تجهيز النسخة الاحتياطية')}
function importData(file){const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result),incoming=raw.data||raw;if(!Array.isArray(incoming.subjects)||!Array.isArray(incoming.plans||[]))throw Error('invalid');if(!confirm('استبدال البيانات الحالية بمحتوى النسخة الاحتياطية؟ صدّر نسخة من بياناتك الحالية أولًا إن احتجت إليها.'))return;state={...blank(),...incoming};save();render();toast('تمت استعادة النسخة الاحتياطية')}catch(e){toast('الملف غير صالح أو ليس نسخة مدرستي')} };r.readAsText(file)}
function planSubmit(e){e.preventDefault();const hours=Math.max(1,Math.min(16,Number($('hours').value)||4)),days=[...document.querySelectorAll('input[name=day]:checked')].map(x=>Number(x.value));if(!days.length){toast('اختر يومًا واحدًا على الأقل');return}const selected=[...document.querySelectorAll('input[name=planSubject]:checked')].map(x=>x.value),ls=allLectures().filter(l=>!l.completed&&(!selected.length||selected.includes(l.subject.id))),perDay=Math.max(1,Math.floor(hours)),remaining=ls.length,plan={id:uid(),title:$('planTitle').value.trim()||'خطة دراسية',hours,daysCount:days.length,days,remaining,perDay:Math.ceil(remaining/(days.length*7))||0,summary:'المتبقي وقت الإنشاء: '+remaining+' محاضرة؛ تقدير مبسط حسب الساعات والأيام المختارة.',createdAt:new Date().toISOString()};state.prefs={hours,days};state.plans.unshift(plan);save();log('plan','إنشاء خطة: '+plan.title);render();toast('تم حفظ الخطة')}
function assistantReply(txt){const x=txt.trim(),lower=x.toLowerCase(),ls=allLectures();if(/كم.*(محاضرة|محاضرات).*(متبقي|باقي)|كم.*باقي/.test(x)){let remaining=ls.filter(l=>!l.completed).length;return 'حسب البيانات المحلية الحالية، عندك '+remaining+' محاضرة غير مكتملة من أصل '+ls.length+'.'}if(/اعرض|أظهر|وريني/.test(x)&&/مواد|موادي/.test(x))return state.subjects.length?'المواد المسجلة: '+state.subjects.map(s=>s.name).join('، '):'ماكو مواد مسجلة حاليًا.';if(/إحصائيات|احصائيات|تقدمي|تقدّم/.test(x))return 'التقدم الحالي: '+progress(ls)+'٪. المكتمل '+ls.filter(l=>l.completed).length+'، والمتبقي '+ls.filter(l=>!l.completed).length+'.';if(/أضف مادة|اضف مادة|انشئ مادة|أنشئ مادة/.test(x)){const m=x.match(/(?:مادة)\s+(.+?)(?:[.!،]|$)/);if(m){const name=m[1].trim();if(state.subjects.some(s=>s.name===name))return 'المادة «'+name+'» موجودة بالفعل. افتح قسم موادي لإدارتها.';state.subjects.push({id:uid(),name,icon:'▦',description:'',order:state.subjects.length,teachers:[]});save();log('subject','إضافة مادة: '+name);return 'تمت إضافة مادة «'+name+'» إلى قائمتك المحلية.'}return 'اكتب اسم المادة بعد الأمر، مثل: أضف مادة الفيزياء.'}if(/خطة/.test(x))return 'افتح قسم «خطة الدراسة» لتحديد ساعاتك وأيامك وحفظ خطة من المحاضرات غير المكتملة.';if(/يوتيوب|playlist|قائمة تشغيل/.test(x))return 'استيراد قائمة YouTube تلقائيًا غير مفعّل؛ يحتاج خدمة خلفية ومفتاح YouTube Data API. يمكنك حفظ رابط القائمة داخل بيانات الفصل، ثم إضافة عناوين المحاضرات يدويًا دون اختلاق بيانات.';return 'ما أگدر أنفذ هذا الأمر بعد. جرّب: «كم محاضرة متبقية؟»، «اعرض موادي»، «أضف مادة الفيزياء»، أو استخدم الأزرار لإدارة المدرسين والفصول والمحاضرات.'}
function chatSubmit(e){e.preventDefault();const inp=$('chatInput'),txt=inp.value.trim();if(!txt)return;state.chat.push({role:'user',text:txt});const answer=assistantReply(txt);state.chat.push({role:'bot',text:answer});state.chat=state.chat.slice(-50);save();render();const m=$('messages');m.scrollTop=m.scrollHeight}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;subjectId=teacherId=chapterId=null;query='';render()});
$('quickAdd').onclick=()=>{page='add';render()};
$('themeBtn').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();render()};
$('view').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,{...b.dataset})});
$('view').addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='toggle-lecture')act('toggle-lecture',{...el.dataset,checked:el.checked});if(el.id==='lectureFilter'){filter=el.value;render()}if(el.id==='importFile'&&el.files[0])importData(el.files[0]);});
$('view').addEventListener('input',e=>{if(e.target.id==='lectureSearch'){query=e.target.value;const pos=e.target.selectionStart;render();const i=$('lectureSearch');i?.focus();i?.setSelectionRange(pos,pos)}});
$('view').addEventListener('submit',e=>{if(e.target.id==='planForm')planSubmit(e);if(e.target.id==='chatForm')chatSubmit(e)});
save();render();
})();
</script></body></html>
